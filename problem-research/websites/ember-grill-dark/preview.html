<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Recipe Sites — Side by Side</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,sans-serif;background:#1a1a1a;color:#eee;padding:20px;min-height:100vh}
  h1{font-size:1.2rem;margin-bottom:16px;text-align:center;font-weight:600;letter-spacing:.5px}
  .row{display:grid;grid-template-columns:1fr;gap:16px;max-width:1400px;margin:0 auto}
  @media(min-width:900px){.row{grid-template-columns:1fr 1fr}}
  .card{background:#222;border-radius:12px;overflow:hidden;border:1px solid #333}
  .card h2{padding:14px 16px;background:#2a2a2a;font-size:.95rem;border-bottom:1px solid #333}
  .card h2 .tag{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;margin-left:8px;font-weight:600}
  .tag.light{background:#FFE4D9;color:#C94425}
  .tag.dark{background:#FF5A2E;color:#0E1218}
  iframe{width:100%;height:1200px;border:none;display:block}
  a{display:block;text-align:center;padding:10px;color:#FF8B5A;text-decoration:none;font-size:.85rem}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
  <h1>Recipe Sites — Compare</h1>
  <div class="row">
    <div class="card">
      <h2>Quick Halal Kitchen <span class="tag light">Light · Previous</span></h2>
      <iframe src="../quick-halal-kitchen/index.html"></iframe>
      <a href="../quick-halal-kitchen/index.html" target="_blank">Open in new tab →</a>
    </div>
    <div class="card">
      <h2>Ember & Ash <span class="tag dark">Dark · New</span></h2>
      <iframe src="index.html"></iframe>
      <a href="index.html" target="_blank">Open in new tab →</a>
    </div>
  </div>
</body>
</html>
